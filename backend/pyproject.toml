[project]
name = "ai-api-assistant"
version = "0.1.0"
description = "Production-grade AI API Assistant backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "redis>=5.0",
    "httpx>=0.27",
    "tenacity>=9.0",
    "python-jose[cryptography]>=3.3",
    "argon2-cffi>=23.1",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "groq>=0.11",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-exporter-otlp>=1.27",
    "prometheus-fastapi-instrumentator>=7.0",
    "prometheus-client>=0.20",
    "structlog>=24.4",
    "langfuse>=2.50,<3.0",
    "email-validator==2.3.0",
    "celery>=5.4",
    "flower>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov==7.1.0",
    "httpx>=0.27",
    "asgi_lifespan==2.1.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "coverage>=7.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "B008",
    "BLE001",
]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
