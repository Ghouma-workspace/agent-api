name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_assistant_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Lint
        working-directory: backend
        run: ruff check app

      # - name: Type check
      #   working-directory: backend
      #   run: mypy app

      - name: Test
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_assistant_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: ci-test-secret-key
          GROQ_API_KEY: test-key
          ENVIRONMENT: test
        run: pytest --cov=app --cov-report=xml

  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - working-directory: frontend
        run: npm install && npm audit --audit-level=critical && npm run lint

  deploy:
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    # Only deploy on push to main, not on PRs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/app/agent-api

            # Pull latest code
            git fetch origin main
            git reset --hard origin/main

            # Rebuild only changed services, no downtime on unchanged ones
            docker compose pull --ignore-pull-failures || true
            docker compose build --no-cache backend frontend
            docker compose up -d --remove-orphans

            # Run migrations
            docker compose exec -T backend alembic upgrade head

            # Clean up old images to save disk space (30GB fills up fast)
            docker image prune -f